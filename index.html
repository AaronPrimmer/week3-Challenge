<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Galore</title>
    <script src="js/wordGuess.js"></script>
    <link type="stylesheet" src="css/reset.css" />
    <link type="stylesheet" src="css/style.css" />
  </head>
  <body>
    <header class="header-section"></header>
    <main class="main-section">
      <section class="word-guess-section">
        <h2>- Word Guessing Game -</h2>
        <h3 id="win-or-lose"></h3>
        <div class="word-to-guess" id="guessingWord"></div>
        <h3>Guessed Letters:</h3>
        <div class="guessed-letters" id="letters-guessed"></div>
        <h4 id="guesses-left">Guesses Left: 10</h4>
        <button class="guessing-button" id="guess-again-button">
          Play Again
        </button>
      </section>
    </main>
    <footer class="footer-section"></footer>
  </body>
</html>
