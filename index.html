<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Galore</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" />
    <script src="js/wordGuess.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header-section">
      <h1 class="main-title">Guessing Games</h1>
      <nav class="navigation-links">
        <a href="#" id="number-guessing-link">Number Guessing Game</a>
        <a href="#" id="word-guessing-link">Word Guessing Game</a>
      </nav>
    </header>
    <main class="main-section">
      <section class="word-guess-section">
        <h2>🧠 Word Guessing Game</h2>
        <h3 id="win-or-lose">Good Luck!</h3>
        <div class="word-to-guess" id="guessingWord"></div>
        <h3>Guessed Letters:</h3>
        <div
          class="guessed-letters"
          id="letters-guessed"
          virtualkeyboardpolicy="manual"
        ></div>
        <h3 id="guesses-left">Guesses Left: 10</h3>
        <div contenteditable virtualkeyboardpolicy="manual" id="editor"></div>
        <div class="button-container">
          <button class="guessing-button" id="guess-again-button">
            Play Again
          </button>
          <button class="mobile-button" id="mobile-keyboard-button">
            Open Keyboard
          </button>
        </div>
      </section>
    </main>
    <footer class="footer-section"></footer>
  </body>
</html>
